<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#08090a"/>
  <g transform="translate(58.84 91.21) scale(1.0789)">
    <!-- the receipt from the pinned model: a ticket, slotted where an admitted trade passes -->
    <path d="M300 360 V120 H368 A36 36 0 0 0 440 120 H580 V360 M300 440 V680 H368 A36 36 0 0 1 440 680 H580 V440" fill="none" stroke="#c3f53c" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- the receipt hash -->
    <g fill="none" stroke="#c3f53c" stroke-width="18" stroke-linecap="round"><path d="M350 200 H530 M350 252 H470 M350 560 H530 M350 612 H470"/></g>
    <!-- admitted: in cap, through the slot, lands -->
    <path d="M60 400 H650" fill="none" stroke="#3ec6a8" stroke-width="34" stroke-linecap="round"/>
    <circle cx="700" cy="400" r="26" fill="#3ec6a8" stroke="#3ec6a8" stroke-width="2"/>
    <!-- the owner's cap wall -->
    <path d="M760 300 V500" fill="none" stroke="#e3b341" stroke-width="30" stroke-linecap="round"/>
    <!-- no receipt: stops at the solid edge -->
    <path d="M60 250 H262" fill="none" stroke="#f2555a" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
